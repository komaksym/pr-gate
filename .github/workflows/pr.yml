name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]
    with:
      run: ''
    permissions:
      contents: read
      pull-requests: read

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck apply-ruleset.sh apply-codecov-ruleset.sh
      - run: bash -n apply-ruleset.sh
      - run: bash -n apply-codecov-ruleset.sh
      - run: python3 -m unittest discover -s tests -v
      - run: jq -e '.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.context == "gate")' ruleset.json
      - run: |
          jq -e '.name == "pr-gate-codecov" and (.rules | length == 1) and .rules[0].parameters.required_status_checks == [{"context": "codecov/patch"}]' codecov-ruleset.json

  gate:
    if: always()
    needs: [checks, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo gate passed
